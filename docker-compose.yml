# Exemple : daikin2mqtt + Mosquitto.
# Toute la configuration vient des deux fichiers YAML du dossier ./config (config.yml et entities.yml) :
#   cp config/config.example.yml config/config.yml    (Mqtt.Host: mosquitto est déjà renseigné)
# ou, sans fichier, via l'interface web (http://localhost:${PUBLIC_PORT}) qui les crée.
# Si vous avez déjà un broker Mosquitto, supprimez le service "mosquitto" et renseignez Mqtt.Host dans config/config.yml.
# Copiez .env.example vers .env pour changer les ports ou surcharger un réglage (Section__Cle=valeur).

services:
  daikin2mqtt:
    build: .
    pull_policy: build
    image: daikin2mqtt:latest
    container_name: daikin2mqtt
    restart: unless-stopped
    # Variables d'environnement facultatives : elles l'emportent sur les fichiers de config.
    env_file:
      - path: .env
        required: false
    volumes:
      # Toute la configuration : config.yml (MQTT, unités Daikin, appareil) et entities.yml (entités personnalisées).
      # Pas en :ro : l'interface web les modifie. Le conteneur tourne en utilisateur non-root (uid 1654) : sous Linux,
      # le dossier doit lui être accessible en écriture (sudo chown -R 1654 config).
      - "${CONFIG_DIR:-./config}:/config"
    ports:
      - "${PUBLIC_PORT:-8080}:8080"   # interface web de configuration (Web.Port ; protégez-la avec Web.Password dans config.yml)
    # Le scan réseau de l'interface web (broadcast UDP, port 30050) ne traverse pas le réseau « bridge » de Docker.
    # Sous Linux, pour qu'il trouve les unités, utilisez le réseau de l'hôte à la place de "ports" / du réseau du compose :
    #   network_mode: host     (et Mqtt.Host: localhost, Web.Port: ${PUBLIC_PORT} ; "ports" et "depends_on" sont alors à retirer)
    # Sinon, saisissez simplement l'adresse IP de chaque unité dans l'onglet « Unités ».

